<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - Surya Coaching Centre</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#0d47a1,#42a5f5);
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:20px;
    padding:30px 24px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    width:75px;
    height:75px;
    margin:auto;
    border-radius:50%;
    background:#1565c0;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
}

h1{
    text-align:center;
    color:#1565c0;
    margin:18px 0 5px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#1565c0;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#1565c0;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#1565c0;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">SC</div>

    <h1>Surya Coaching Centre</h1>

    <div class="subtitle">
        Admin Login
    </div>

    <form id="adminLoginForm">

        <label>Admin Email</label>
        <input
            type="email"
            id="adminEmail"
            placeholder="Admin email डालें"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="adminPassword"
            placeholder="Password डालें"
            required
        >

        <button type="submit">
            🔐 Admin Login
        </button>

        <div class="message" id="message"></div>

    </form>

    <a href="index.html" class="back">
        ← Home Page पर जाएँ
    </a>

</div>

<script>

document.getElementById("adminLoginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const email =
        document.getElementById("adminEmail").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    const message =
        document.getElementById("message");

    /*
      अभी यह temporary frontend login है।
      Firebase Authentication जोड़ने के बाद
      यहाँ वास्तविक secure login लगाया जाएगा।
    */

    if(email === "admin@surya.com" && password === "Surya@123"){

        localStorage.setItem("suryaAdminLogin","true");

        message.style.color = "green";
        message.innerHTML = "Login सफल!";

        setTimeout(function(){
            window.location.href = "admin-class.html";
        },800);

    }else{

        message.style.color = "red";
        message.innerHTML =
            "Email या Password गलत है।";

    }

});

</script>

</body>
</html>
