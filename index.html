<style>
*{

}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

header{
  background:#1565c0;
  color:white;
  padding:22px 15px;
  text-align:center;
}

}

}

.container{

.hero h2{

.buttons{

  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.btn{
  display:block;
  text-decoration:none;
  color:white;
  padding:18px 10px;
  border-radius:12px;
  text-align:center;
  font-size:17px;
  font-weight:bold;
  background:#1976d2;
}

.btn:hover{
  opacity:.9;
}

.login{
  background:#2e7d32;
}

.admin{
  background:#6a1b9a;
}

.competition{
  background:#ef6c00;
}

.notes{
  background:#00838f;
}

.live{
  background:#c62828;
}

.test{
  background:#455a64;
}

footer{
  margin-top:30px;
  background:#1565c0;
  color:white;
  text-align:center;
  padding:18px;
}
</style>
</head>

  </a>
