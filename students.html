<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - Suriya Coaching Centre</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#1565c0,#42a5f5);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.box{
width:92%;
max-width:400px;
background:white;
padding:30px 25px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
text-align:center;
color:#1565c0;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

input{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
margin-top:8px;
}

button{
width:100%;
padding:14px;
margin-top:18px;
border:0;
border-radius:8px;
background:#1565c0;
color:white;
font-size:17px;
font-weight:bold;
}

#error{
color:red;
text-align:center;
margin-top:15px;
}

#adminPanel{
display:none;
}

.logout{
background:#d32f2f;
}
</style>
</head>

<body>

<div class="box">

<div id="loginPage">

<h1>🔐 Admin Login</h1>

<div class="subtitle">
Suriya Coaching Centre
</div>

<label>Admin ID</label>

<input
type="text"
id="adminId"
placeholder="Admin ID डालें">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Password डालें">

<button onclick="login()">
Admin Login
</button>

<div id="error"></div>

</div>


<div id="adminPanel">

<h1>👨‍💼 Admin Panel</h1>

<div class="subtitle">
Suriya Coaching Centre
</div>


<button onclick="openStudents()">
👨‍🎓 Student Management
</button>


<button>
📚 Class Management
</button>


<button>
📝 Notes Management
</button>


<button>
🎥 Live Class
</button>


<button>
📢 Notice Management
</button>


<button class="logout" onclick="logout()">
🚪 Logout
</button>

</div>

</div>


<script>

function login(){

let id=document.getElementById("adminId").value;

let password=document.getElementById("password").value;

if(id==="admin" && password==="12345"){

document.getElementById("loginPage").style.display="none";

document.getElementById("adminPanel").style.display="block";

}else{

document.getElementById("error").innerHTML=
"❌ Admin ID या Password गलत है";

}

}


function openStudents(){

window.location.href="students.html";

}


function logout(){

document.getElementById("adminPanel").style.display="none";

document.getElementById("loginPage").style.display="block";

document.getElementById("adminId").value="";

document.getElementById("password").value="";

document.getElementById("error").innerHTML="";

}

</script>

</body>
</html>
.
