<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management - Suriya Coaching Centre</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
}

header{
background:#1565c0;
color:white;
padding:20px;
text-align:center;
}

.container{
width:94%;
max-width:600px;
margin:20px auto;
}

.box{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.12);
margin-bottom:20px;
}

h2{
color:#1565c0;
}

label{
display:block;
font-weight:bold;
margin-top:12px;
margin-bottom:6px;
}

input,select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:13px;
margin-top:18px;
border:0;
border-radius:8px;
background:#1565c0;
color:white;
font-size:16px;
font-weight:bold;
}

.student{
border:1px solid #ddd;
border-radius:10px;
padding:15px;
margin-top:12px;
background:#fafafa;
}

.student b{
color:#1565c0;
}

.delete{
background:#d32f2f;
padding:9px;
font-size:14px;
}

.back{
background:#555;
}
</style>
</head>

<body>

<header>
<h1>👨‍🎓 Student Management</h1>
<p>Suriya Coaching Centre</p>
</header>

<div class="container">

<div class="box">

<h2>➕ नया Student जोड़ें</h2>

<label>Student Name</label>
<input type="text" id="studentName" placeholder="छात्र का नाम">

<label>Mobile Number</label>
<input type="tel" id="studentMobile"
placeholder="मोबाइल नंबर" maxlength="10">

<label>Class</label>

<select id="studentClass">
<option value="">कक्षा चुनें</option>
<option value="9">Class 9</option>
<option value="10">Class 10</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>

<button onclick="addStudent()">
➕ Student Add करें
</button>

</div>

<div class="box">

<h2>👨‍🎓 Student List</h2>

<div id="studentList"></div>

</div>

<div class="box">

<button class="back" onclick="history.back()">
⬅️ Admin Panel पर वापस जाएँ
</button>

</div>

</div>

<script>

function getStudents(){

let data=localStorage.getItem("suriyaStudents");

if(data){
return JSON.parse(data);
}

return [];
}


function saveStudents(students){

localStorage.setItem(
"suriyaStudents",
JSON.stringify(students)
);

}


function addStudent(){

let name=document.getElementById("studentName").value.trim();

let mobile=document.getElementById("studentMobile").value.trim();

let studentClass=document.getElementById("studentClass").value;


if(name===""){
alert("Student का नाम डालिए");
return;
}

if(mobile.length!==10){
alert("10 अंकों का Mobile Number डालिए");
return;
}

if(studentClass===""){
alert("Class चुनिए");
return;
}


let students=getStudents();

students.push({
id:Date.now(),
name:name,
mobile:mobile,
className:studentClass
});

saveStudents(students);


document.getElementById("studentName").value="";
document.getElementById("studentMobile").value="";
document.getElementById("studentClass").value="";


showStudents();

alert("Student सफलतापूर्वक जोड़ दिया गया।");

}


function showStudents(){
