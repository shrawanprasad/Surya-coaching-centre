<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - Suriya Coaching Centre</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#1565c0,#42a5f5);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:20px;
  padding:30px 25px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.logo{
  width:80px;
  height:80px;
  margin:auto;
  border-radius:50%;
  background:#1565c0;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:35px;
  font-weight:bold;
}

h1{
  text-align:center;
  color:#1565c0;
  font-size:26px;
}

.subtitle{
  text-align:center;
  color:#555;
  margin-bottom:25px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.login-btn{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#1565c0;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  text-align:center;
}

.home{
  display:block;
  text-align:center;
  margin-top:20px;
  text-decoration:none;
  color:#1565c0;
}
</style>
</head>

<body>

<div class="login-box">

<div class="logo">S</div>

<h1>SURIYA COACHING CENTRE</h1>

<div class="subtitle">🎓 Student Login</div>

<form id="loginForm">

<label>विद्यार्थी का नाम</label>
<input type="text" id="name" placeholder="अपना नाम लिखें" required>

<label>मोबाइल नंबर</label>
<input type="tel" id="mobile"
placeholder="10 अंकों का मोबाइल नंबर"
maxlength="10" required>

<label>कक्षा चुनें</label>
<select id="className" required>
<option value="">-- कक्षा चुनें --</option>
<option value="9">Class 9</option>
<option value="10">Class 10</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>

<button class="login-btn" type="submit">
🔐 Student Login
</button>

</form>

<div id="message" class="message"></div>

<a class="home" href="index.html">
← Home Page
</a>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

let name=document.getElementById("name").value.trim();
let mobile=document.getElementById("mobile").value.trim();
let className=document.getElementById("className").value;

if(!/^[0-9]{10}$/.test(mobile)){
alert("कृपया सही 10 अंकों का मोबाइल नंबर डालें");
return;
}

localStorage.setItem("studentName",name);
localStorage.setItem("studentMobile",mobile);
localStorage.setItem("studentClass",className);
localStorage.setItem("studentLoggedIn","true");

alert("Student Login सफल हुआ!");

window.location.href="student-dashboard.html";

});
</script>

</body>
</html>
