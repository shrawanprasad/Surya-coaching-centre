<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notes Management - Surya Coaching Centre</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:22px 15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:7px 0 0;
    font-size:14px;
    opacity:.9;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#0d47a1;
    font-size:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
    font-size:14px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccd5e0;
    border-radius:9px;
    font-size:15px;
    outline:none;
}

input:focus,select:focus,textarea:focus{
    border-color:#1976d2;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn{
    background:#1976d2;
    color:white;
}

.clear-btn{
    background:#e8eef5;
    color:#333;
}

.filter-grid{
    display:grid;
    grid-template-columns:1fr 1fr 2fr;
    gap:10px;
}

.note-item{
    border:1px solid #e1e7ee;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
    background:#fff;
}

.note-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#e3f2fd;
    color:#0d47a1;
    font-size:12px;
    font-weight:bold;
}

.note-title{
    font-size:18px;
    font-weight:bold;
    margin:10px 0 6px;
}

.note-info{
    color:#555;
    font-size:14px;
    line-height:1.6;
}

.note-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.view-btn{
    background:#2e7d32;
    color:white;
}

.edit-btn{
    background:#f9a825;
    color:white;
}

.delete-btn{
    background:#c62828;
    color:white;
}

.status{
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.active{
    background:#e8f5e9;
    color:#2e7d32;
}

.hidden{
    background:#ffebee;
    color:#c62828;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px 10px;
}

.footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:20px;
}

@media(max-width:650px){
    .form-grid,
    .filter-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }

    .header h1{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📚 Surya Coaching Centre</h1>
    <p>Professional Notes Management</p>
</div>

<div class="container">

    <!-- ADD NOTES -->
    <div class="card">
        <h2>➕ Add / Update Notes</h2>

        <form id="notesForm">

            <input type="hidden" id="editId">

            <div class="form-grid">

                <div>
                    <label>Class</label>
                    <select id="className" required>
                        <option value="">Select Class</option>
                        <option value="Class 9">Class 9</option>
                        <option value="Class 10">Class 10</option>
                        <option value="Class 11">Class 11</option>
                        <option value="Class 12">Class 12</option>
                    </select>
                </div>

                <div>
                    <label>Subject</label>
                    <select id="subject" required>
                        <option value="">Select Subject</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Biology">Biology</option>
                    </select>
                </div>

                <div>
                    <label>Chapter Number</label>
                    <input
                        type="number"
                        id="chapter"
                        min="1"
                        placeholder="Example: 1"
                        required>
                </div>

                <div>
                    <label>Chapter / Notes Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Matter in Our Surroundings"
                        required>
                </div>

                <div class="full">
                    <label>Notes Link / PDF Link</label>
                    <input
                        type="url"
                        id="notesLink"
                        placeholder="https://..."
                        required>
                </div>

                <div class="full">
                    <label>Notes Description</label>
                    <textarea
                        id="description"
                        placeholder="Notes में क्या-क्या मिलेगा..."></textarea>
                </div>

                <div>
                    <label>Teacher Name</label>
                    <input
                        type="text"
                        id="teacher"
                        placeholder="Teacher name">
                </div>

                <div>
                    <label>Student Visibility</label>
                    <select id="visibility">
                        <option value="active">Student को दिखाएं</option>
                        <option value="hidden">Student से छुपाएं</option>
                    </select>
                </div>

            </div>

            <div class="buttons">
                <button type="submit" class="save-btn">
                    💾 Save Notes
                </button>

                <button type="button" class="clear-btn" onclick="clearForm()">
                    ✖ Clear
                </button>
            </div>

        </form>
    </div>


    <!-- FILTER -->
    <div class="card">
        <h2>🔎 Search Notes</h2>

        <div class="filter-grid">

            <select id="filterClass" onchange="displayNotes()">
                <option value="">All Classes</option>
                <option value="Class 9">Class 9</option>
                <option value="Class 10">Class 10</option>
                <option value="Class 11">Class 11</option>
                <option value="Class 12">Class 12</option>
            </select>

            <select id="filterSubject" onchange="displayNotes()">
                <option value="">All Subjects</option>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Biology">Biology</option>
            </select>

            <input
                type="text"
                id="search"
                placeholder="Search chapter or notes..."
                oninput="displayNotes()">

        </div>
    </div>


    <!-- NOTES LIST -->
    <div class="card">
        <h2>📖 Notes List</h2>

        <div id="notesList"></div>
    </div>

</div>

<div class="footer">
    © 2026 Surya Coaching Centre | Admin Notes Management
</div>


<script>

const STORAGE_KEY = "surya_coaching_notes";

let notes = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
);


// SAVE / UPDATE
document.getElementById("notesForm").addEventListener("submit", function(e){

    e.preventDefault();

    const editId = document.getElementById("editId").value;

    const note = {
        id: editId || Date.now().toString(),

        className:
            document.getElementById("className").value,

        subject:
            document.getElementById("subject").value,

        chapter:
            document.getElementById("chapter").value,

        title:
            document.getElementById("title").value.trim(),

        notesLink:
            document.getElementById("notesLink").value.trim(),

        description:
            document.getElementById("description").value.trim(),

        teacher:
            document.getElementById("teacher").value.trim(),

        visibility:
            document.getElementById("visibility").value,

        updatedAt:
            new Date().toLocaleDateString("hi-IN")
    };


    if(editId){

        const index = notes.findIndex(
            item => item.id === editId
        );

        if(index !== -1){
            notes[index] = note;
        }

        alert("✅ Notes successfully updated!");

    }else{

        notes.push(note);

        alert("✅ Notes successfully saved!");

    }


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(notes)
    );

    clearForm();
    displayNotes();

});


// DISPLAY NOTES
function displayNotes(){

    const list =
        document.getElementById("notesList");

    const filterClass =
        document.getElementById("filterClass").value;

    const filterSubject =
        document.getElementById("filterSubject").value;

    const search =
        document.getElementById("search").value
        .toLowerCase()
        .trim();


    let filtered = notes.filter(note => {

        const classMatch =
            !filterClass ||
            note.className === filterClass;

        const subjectMatch =
            !filterSubject ||
            note.subject === filterSubject;

        const searchMatch =
            !search ||
            note.title.toLowerCase().includes(search) ||
            note.subject.toLowerCase().includes(search) ||
            note.className.toLowerCase().includes(search);

        return classMatch &&
               subjectMatch &&
               searchMatch;
    });


    if(filtered.length === 0){

        list.innerHTML = `
            <div class="empty">
                📚 अभी कोई Notes उपलब्ध नहीं है।
            </div>
        `;

        return;
    }


    list.innerHTML = filtered.map(note => {

        const statusText =
            note.visibility === "active"
            ? "Student को दिखाई देगा"
            : "Student से छुपा है";

        const statusClass =
            note.visibility === "active"
            ? "active"
            : "hidden";


        return `
            <div class="note-item">

                <div class="note-top">

                    <div>
                        <span class="badge">
                            ${escapeHTML(note.className)}
                        </span>

                        <span class="badge">
                            ${escapeHTML(note.subject)}
                        </span>
                    </div>

                    <span class="status ${statusClass}">
                        ${statusText}
                    </span>

                </div>


                <div class="note-title">
                    Chapter ${escapeHTML(note.chapter)}
                    — ${escapeHTML(note.title)}
                </div>


                <div class="note-info">

                    ${note.description
                        ? escapeHTML(note.description)
                        : "No description available."
                    }

                    <br><br>

                    👨‍🏫 Teacher:
                    ${note.teacher
                        ? escapeHTML(note.teacher)
                        : "Not added"
                    }

                    <br>

                    📅 Updated:
                    ${escapeHTML(note.updatedAt)}

                </div>


                <div class="note-actions">

                    <button
                        class="view-btn"
                        onclick="viewNote('${note.id}')">
                        👁 View Notes
                    </button>

                    <button
                        class="edit-btn"
                        onclick="editNote('${note.id}')">
                        ✏ Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteNote('${note.id}')">
                        🗑 Delete
                    </button>

                </div>

            </div>
        `;

    }).join("");
}


// VIEW NOTE
function viewNote(id){

    const note =
        notes.find(item => item.id === id);

    if(!note) return;

    window.open(
        note.notesLink,
        "_blank"
    );
}


// EDIT NOTE
function editNote(id){

    const note =
        notes.find(item => item.id === id);

    if(!note) return;


    document.getElementById("editId").value =
        note.id;

    document.getElementById("className").value =
        note.className;

    document.getElementById("subject").value =
        note.subject;

    document.getElementById("chapter").value =
        note.chapter;

    document.getElementById("title").value =
        note.title;

    document.getElementById("notesLink").value =
        note.notesLink;

    document.getElementById("description").value =
        note.description;

    document.getElementById("teacher").value =
        note.teacher;

    document.getElementById("visibility").value =
        note.visibility;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


// DELETE NOTE
function deleteNote(id){

    const confirmDelete =
        confirm("क्या आप यह Notes delete करना चाहते हैं?");

    if(!confirmDelete) return;


    notes =
        notes.filter(item => item.id !== id);


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(notes)
    );

    displayNotes();

    alert("🗑 Notes deleted successfully!");
}


// CLEAR FORM
function clearForm(){

    document.getElementById("notesForm").reset();

    document.getElementById("editId").value = "";

    document.getElementById("visibility").value =
        "active";
}


// HTML SECURITY HELPER
function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


// FIRST LOAD
displayNotes();

</script>

</body>
</html>
