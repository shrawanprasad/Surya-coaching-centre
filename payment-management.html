<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Management - Surya Coaching Centre</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
    color:white;
    text-align:center;
    padding:24px 15px;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:7px 0 0;
    font-size:14px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:18px;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#1565c0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:13px;
}

input,select{
    width:100%;
    padding:13px;
    margin-top:6px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:15px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 16px;
    margin-top:15px;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.save{
    width:100%;
    background:#1565c0;
    color:white;
}

.clear{
    width:100%;
    background:#e0e0e0;
}

.payment{
    border:1px solid #ddd;
    border-radius:13px;
    padding:16px;
    margin-top:13px;
}

.payment h3{
    margin:0 0 8px;
    color:#1565c0;
}

.price{
    font-size:21px;
    font-weight:bold;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.active{
    background:#e8f5e9;
    color:#2e7d32;
}

.expired{
    background:#ffebee;
    color:#c62828;
}

.pending{
    background:#fff3e0;
    color:#ef6c00;
}

.extend{
    background:#2e7d32;
    color:white;
}

.delete{
    background:#d32f2f;
    color:white;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

.info{
    background:#e3f2fd;
    color:#0d47a1;
    padding:13px;
    border-radius:9px;
    margin-top:13px;
    font-size:14px;
    line-height:1.5;
}

.back{
    width:100%;
    background:#455a64;
    color:white;
}

@media(max-width:600px){
    .container{
        padding:12px;
    }

    .header h1{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>☀️ Surya Coaching Centre</h1>
    <p>Payment Management</p>
</div>

<div class="container">

<!-- ADD PAYMENT -->

<div class="card">

<h2>💳 Add Course Purchase</h2>

<label>Student Name</label>
<input
    type="text"
    id="studentName"
    placeholder="Student का नाम">

<label>Student ID / Mobile</label>
<input
    type="text"
    id="studentId"
    placeholder="Student ID या Mobile Number">

<label>Course</label>

<select id="courseName">

    <option value="">
        -- Course चुनें --
    </option>

    <option value="Class 9 Complete Course">
        Class 9 Complete Course
    </option>

    <option value="Class 10 Complete Course">
        Class 10 Complete Course
    </option>

    <option value="Class 11 Complete Course">
        Class 11 Complete Course
    </option>

    <option value="Class 12 Complete Course">
        Class 12 Complete Course
    </option>

</select>

<label>Course Price (₹)</label>

<input
    type="number"
    id="price"
    placeholder="Example: 499">

<label>Payment Status</label>

<select id="paymentStatus">

    <option value="Paid">
        Paid
    </option>

    <option value="Pending">
        Pending
    </option>

</select>

<label>Course Start Date</label>

<input
    type="date"
    id="startDate">

<div class="info">

    ⏳ <b>Course Validity: 12 Months</b><br>

    Start Date से 12 महीने बाद course expire होगा।

</div>

<button
    class="save"
    onclick="savePayment()">

    💾 Save Payment

</button>

<button
    class="clear"
    onclick="clearForm()">

    ↻ Clear

</button>

</div>


<!-- PAYMENT RECORDS -->

<div class="card">

<h2>📋 Payment Records</h2>

<div id="paymentList"></div>

</div>


<!-- BACK -->

<div class="card">

<button
    class="back"
    onclick="goAdmin()">

    ← Back to Admin Panel

</button>

</div>

</div>


<script>

let payments =
JSON.parse(localStorage.getItem("suryaPayments")) || [];


/* TODAY */

function todayDate(){

    const d = new Date();

    const y = d.getFullYear();

    const m =
        String(d.getMonth()+1).padStart(2,"0");

    const day =
        String(d.getDate()).padStart(2,"0");

    return y + "-" + m + "-" + day;
}


/* ADD 12 MONTHS */

function add12Months(dateString){

    const date =
        new Date(dateString);

    date.setMonth(
        date.getMonth() + 12
    );

    const y =
        date.getFullYear();

    const m =
        String(date.getMonth()+1).padStart(2,"0");

    const day =
        String(date.getDate()).padStart(2,"0");

    return y + "-" + m + "-" + day;
}


/* SAVE */

function savePayment(){

    const studentName =
        document.getElementById("studentName")
        .value.trim();

    const studentId =
        document.getElementById("studentId")
        .value.trim();

    const courseName =
        document.getElementById("courseName")
        .value;

    const price =
        document.getElementById("price")
        .value;

    const paymentStatus =
        document.getElementById("paymentStatus")
        .value;

    const startDate =
        document.getElementById("startDate")
        .value;


    if(studentName === ""){

        alert("Student Name डालें।");
        return;

    }


    if(studentId === ""){

        alert("Student ID / Mobile डालें।");
        return;

    }


    if(courseName === ""){

        alert("Course चुनें।");
        return;

    }


    if(price === "" || Number(price) <= 0){

        alert("सही Course Price डालें।");
        return;

    }


    if(startDate === ""){

        alert("Start Date चुनें।");
        return;

    }


    const expiryDate =
        add12Months(startDate);


    const record = {

        studentName:studentName,

        studentId:studentId,

        courseName:courseName,

        price:price,

        paymentStatus:paymentStatus,

        startDate:startDate,

        expiryDate:expiryDate

    };


    payments.push(record);


    localStorage.setItem(
        "suryaPayments",
        JSON.stringify(payments)
    );


    alert(
        "Payment Record सफलतापूर्वक Save हो गया।"
    );


    clearForm();

    displayPayments();

}


/* STATUS */

function getStatus(payment){

    if(payment.paymentStatus !== "Paid"){

        return "pending";

    }


    const today =
        new Date(todayDate());

    const expiry =
        new Date(payment.expiryDate);


    if(today > expiry){

        return "expired";

    }


    return "active";

}


/* DISPLAY */

function displayPayments(){

    const list =
        document.getElementById("paymentList");

    list.innerHTML = "";


    if(payments.length === 0){

        list.innerHTML =
        '<div class="empty">अभी कोई Payment Record नहीं है।</div>';

        return;

    }


    payments.forEach(
        function(payment,index){

        const status =
            getStatus(payment);


        let text = "";

        let css = "";


        if(status === "active"){

            text = "ACTIVE";

            css = "active";

        }

        else if(status === "expired"){

            text = "EXPIRED";

            css = "expired";

        }

        else{

            text = "PAYMENT PENDING";

            css = "pending";

        }


        list.innerHTML += `

        <div class="payment">

            <h3>
                ${payment.studentName}
            </h3>

            <p>
                <b>Student ID:</b>
                ${payment.studentId}
            </p>

            <p>
                <b>Course:</b>
                ${payment.courseName}
            </p>

            <p class="price">
                ₹${payment.price}
            </p>

            <p>
                <b>Payment:</b>
                ${payment.paymentStatus}
            </p>

            <p>
                <b>Start:</b>
                ${payment.startDate}
            </p>

            <p>
                <b>Valid Till:</b>
                ${payment.expiryDate}
            </p>

            <span class="status ${css}">
                ${text}
            </span>

            <br>

            <button
                class="extend"
                onclick="extendPayment(${index})">

                🔄 Extend 12 Months

            </button>

            <button
                class="delete"
                onclick="deletePayment(${index})">

                🗑️ Delete

            </button>

        </div>

        `;

    });

}


/* EXTEND */

function extendPayment(index){

    const payment =
        payments[index];


    payment.expiryDate =
        add12Months(
            payment.expiryDate
        );


    payment.paymentStatus =
        "Paid";


    localStorage.setItem(
        "suryaPayments",
        JSON.stringify(payments)
    );


    displayPayments();


    alert(
        "Course validity 12 महीने बढ़ा दी गई है।"
    );

}


/* DELETE */

function deletePayment(index){

    const ok =
        confirm(
            "क्या आप यह payment record delete करना चाहते हैं?"
        );


    if(!ok){
        return;
    }


    payments.splice(index,1);


    localStorage.setItem(
        "suryaPayments",
        JSON.stringify(payments)
    );


    displayPayments();

}


/* CLEAR */

function clearForm(){

    document.getElementById("studentName")
        .value = "";

    document.getElementById("studentId")
        .value = "";

    document.getElementById("courseName")
        .value = "";

    document.getElementById("price")
        .value = "";

    document.getElementById("paymentStatus")
        .value = "Paid";

    document.getElementById("startDate")
        .value = todayDate();

}


/* ADMIN PANEL */

function goAdmin(){

    window.location.href =
        "admin-control-panel.html";

}


/* DEFAULT DATE */

document.getElementById("startDate")
    .value = todayDate();


/* LOAD RECORDS */

displayPayments();

</script>

</body>
</html>
