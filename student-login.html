
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login - Surya Coaching Centre</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0d47a1,#42a5f5);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:400px;
background:white;
border-radius:20px;
padding:30px 25px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.logo{
text-align:center;
font-size:38px;
}

h1{
text-align:center;
color:#0d47a1;
font-size:25px;
margin:8px 0;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:25px;
}

label{
display:block;
margin-top:14px;
font-weight:bold;
color:#333;
}

.input-box{
position:relative;
}

input{
width:100%;
padding:14px;
margin-top:7px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
outline:none;
}

input:focus{
border-color:#1976d2;
}

.show{
position:absolute;
right:12px;
top:20px;
font-size:13px;
color:#1976d2;
cursor:pointer;
}

.login-btn{
width:100%;
margin-top:22px;
padding:14px;
border:0;
border-radius:10px;
background:#0d47a1;
color:white;
font-size:17px;
font-weight:bold;
}

.login-btn:active{
transform:scale(.98);
}

.links{
text-align:center;
margin-top:18px;
}

.links a{
color:#1976d2;
text-decoration:none;
font-size:14px;
}

.home-btn{
width:100%;
margin-top:18px;
padding:12px;
border:0;
border-radius:10px;
background:#eeeeee;
color:#333;
font-size:15px;
}

.footer{
text-align:center;
font-size:12px;
color:#888;
margin-top:22px;
}
</style>
</head>

<body>

<div class="login-box">

<div class="logo">☀️</div>

<h1>Student Login</h1>

<div class="subtitle">
Surya Coaching Centre
</div>

<label>Mobile Number</label>
<input type="tel" id="mobile"
placeholder="अपना मोबाइल नंबर डालें"
maxlength="10">

<label>Password</label>

<div class="input-box">
<input type="password"
id="password"
placeholder="अपना Password डालें">

<span class="show" onclick="showPassword()">
Show
</span>
</div>

<button class="login-btn" onclick="login()">
🔐 Login
</button>

<div class="links">
<a href="#" onclick="registerStudent()">
📝 New Student Registration
</a>
<br><br>
<a href="#" onclick="forgotPassword()">
🔑 Forgot Password?
</a>
</div>

<button class="home-btn" onclick="goHome()">
🏠 Home पर जाएँ
</button>

<div class="footer">
© 2026 Surya Coaching Centre
</div>

</div>

<script>

function showPassword(){

let password=document.getElementById("password");
let show=document.querySelector(".show");

if(password.type==="password"){
password.type="text";
show.innerText="Hide";
}else{
password.type="password";
show.innerText="Show";
}

}

function login(){

let mobile=document.getElementById("mobile").value;
let password=document.getElementById("password").value;

if(mobile==="" || password===""){
alert("कृपया Mobile Number और Password डालें।");
return;
}

alert("Login system अगले चरण में database से जोड़ा जाएगा।");

}

function registerStudent(){

alert("Student Registration अगले चरण में बनाया जाएगा।");

}

function forgotPassword(){

alert("Password Recovery अगले चरण में बनाया जाएगा।");

}

function goHome(){

window.location.href="index.html";

}

</script>

</body>
</html>
