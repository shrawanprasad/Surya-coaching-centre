<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard - Surya Coaching Centre</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#0d47a1,#1976d2);
  color:white;
  padding:18px 16px;
  border-radius:0 0 25px 25px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.notification{
  background:rgba(255,255,255,.18);
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.welcome{
  margin-top:22px;
}

.welcome h2{
  font-size:23px;
  margin-bottom:6px;
}

.welcome p{
  font-size:14px;
  opacity:.9;
}

/* PROFILE CARD */
.profile-card{
  background:white;
  margin:18px 15px;
  padding:18px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,#1565c0,#42a5f5);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

.profile-info h3{
  font-size:18px;
  margin-bottom:5px;
}

.profile-info p{
  font-size:13px;
  color:#666;
}

/* CONTENT */
.container{
  padding:0 15px 90px;
}

.section-title{
  font-size:19px;
  font-weight:bold;
  margin:22px 0 13px;
}

/* COURSE */
.course-card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
  margin-bottom:15px;
}

.course-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.course-title{
  font-size:18px;
  font-weight:bold;
}

.active{
  background:#e8f5e9;
  color:#2e7d32;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.course-info{
  color:#666;
  font-size:13px;
  margin-top:9px;
}

.progress-box{
  margin-top:15px;
}

.progress-text{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:6px;
  color:#555;
}

.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  width:35%;
  height:100%;
  background:#1976d2;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.menu-card{
  background:white;
  border-radius:17px;
  padding:20px 12px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  cursor:pointer;
  transition:.2s;
}

.menu-card:active{
  transform:scale(.96);
}

.icon{
  width:52px;
  height:52px;
  margin:auto;
  border-radius:15px;
  background:#e3f2fd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  margin-bottom:10px;
}

.menu-card h3{
  font-size:15px;
  margin-bottom:5px;
}

.menu-card p{
  font-size:11px;
  color:#777;
}

/* NOTICE */
.notice{
  background:#fff8e1;
  border-left:5px solid #ffb300;
  padding:15px;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:white;
  box-shadow:0 -3px 15px rgba(0,0,0,.1);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.nav-item{
  text-align:center;
  font-size:11px;
  color:#777;
  cursor:pointer;
}

.nav-item span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active-nav{
  color:#1565c0;
  font-weight:bold;
}

/* LOGOUT */
.logout{
  margin-top:20px;
  width:100%;
  border:none;
  background:#ffebee;
  color:#c62828;
  padding:14px;
  border-radius:14px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="header-top">
    <div class="logo">☀️ Surya Coaching Centre</div>

    <div class="notification" onclick="showMessage('अभी कोई नई notification नहीं है।')">
      🔔
    </div>
  </div>

  <div class="welcome">
    <h2>Welcome, Student 👋</h2>
    <p>आपके learning dashboard में आपका स्वागत है।</p>
  </div>

</header>
